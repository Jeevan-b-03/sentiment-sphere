{% extends "base.html" %}

{% block content %}
<div class="min-h-full flex flex-col justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div
        class="max-w-md w-full mx-auto bg-white dark:bg-dark-surface p-8 rounded-2xl shadow-xl border border-gray-100 dark:border-gray-800">
        <!-- Logo and Branding -->
        <div class="flex flex-col items-center mb-4">
            <div
                class="h-28 w-28 bg-white dark:bg-black rounded-2xl flex items-center justify-center shadow-md border border-gray-200 dark:border-gray-700 mb-4 transition-transform hover:scale-105 duration-300">
                <img src="{{ url_for('static', filename='img/sentiment_sphere_logo.png') }}" alt="Sentiment Sphere"
                    class="h-24 w-24 object-contain">
            </div>
            <h1 class="text-3xl font-black text-gray-900 dark:text-white tracking-tight">Sentiment Sphere</h1>
            <p class="mt-1 text-lg text-gray-500 dark:text-gray-400 font-medium">Sentiment Analytics Dashboard</p>
            <p class="mt-1 text-sm text-gray-400 dark:text-gray-500">Use your credentials to sign in</p>
        </div>

        <form class="space-y-3" action="{{ url_for('login') }}" method="POST">
            {% if error %}
            <div class="rounded-xl bg-red-50 dark:bg-red-900/20 p-4 border border-red-100 dark:border-red-900/30">
                <div class="text-sm text-red-600 dark:text-red-400 text-center font-medium">{{ error }}</div>
            </div>
            {% endif %}

            <div class="space-y-2">
                <!-- Username Field -->
                <div>
                    <label for="username"
                        class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-0.5 ml-1">Username</label>
                    <input id="username" name="username" type="text" required
                        class="block w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all duration-200"
                        placeholder="Enter username">
                </div>

                <!-- Password Field -->
                <div class="relative">
                    <label for="password"
                        class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-0.5 ml-1">Password</label>
                    <div class="relative">
                        <input id="password" name="password" type="password" required
                            class="block w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all duration-200"
                            placeholder="Enter password">

                        <button type="button" onclick="togglePassword()"
                            class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-indigo-600 transition-colors">
                            <svg id="eye-open" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none"
                                viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                            <svg id="eye-closed" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden" fill="none"
                                viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <div class="pt-0.5">
                <button type="submit"
                    class="w-full flex justify-center py-3.5 px-4 border border-transparent text-base font-bold rounded-xl text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-4 focus:ring-indigo-500/20 transition-all duration-200 shadow-lg shadow-indigo-100 dark:shadow-none">
                    Sign In
                </button>
                <div class="flex justify-end mt-1.5">
                    <a href="#"
                        class="text-sm font-semibold text-indigo-600 hover:text-indigo-800 dark:text-indigo-400 transition-colors">Forgot
                        password?</a>
                </div>
            </div>

            <p class="text-center text-xs text-gray-400 dark:text-gray-500 mt-3">
                Admin: <span class="bg-gray-100 dark:bg-gray-800 px-1.5 py-0.5 rounded font-mono">admin</span> / <span
                    class="bg-gray-100 dark:bg-gray-800 px-1.5 py-0.5 rounded font-mono">admin</span>
            </p>
        </form>
    </div>
</div>

<script>
    function togglePassword() {
        const passwordInput = document.getElementById('password');
        const eyeOpen = document.getElementById('eye-open');
        const eyeClosed = document.getElementById('eye-closed');

        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            eyeOpen.classList.add('hidden');
            eyeClosed.classList.remove('hidden');
        } else {
            passwordInput.type = 'password';
            eyeOpen.classList.remove('hidden');
            eyeClosed.classList.add('hidden');
        }
    }
</script>
{% endblock %}
